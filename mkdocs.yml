site_name: Engenharia de Dados - IBGE
site_description: Documentação do pipeline de engenharia de dados com dados públicos do IBGE (UNISATC)
site_author: Augusto Benedetti, Murilo Mandelli, Realdo Justino Junior, André Cittadin e Jorge Antônio
site_url: https://murilomandelli.github.io/Trabalho-final---Engenharia-de-dados-/

repo_name: Trabalho-final---Engenharia-de-dados-
repo_url: https://github.com/MuriloMandelli/Trabalho-final---Engenharia-de-dados-
edit_uri: edit/main/docs/

docs_dir: docs

nav:
  - Home: index.md
  - Banco de origem: banco-origem.md
  - Dashboard: dashboard.md
  - Sobre: sobre.md

theme:
  name: material
  palette:
    primary: blue
    accent: light-blue
  language: pt
  features:
    - navigation.footer
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.top
    - navigation.next-prev
    - search
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MuriloMandelli/Trabalho-final---Engenharia-de-dados-
  generator: false

copyright: Copyright &copy; 2026 - Equipe IBGE - Engenharia de Dados UNISATC

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
