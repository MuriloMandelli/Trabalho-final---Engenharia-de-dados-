# Banco de ORIGEM do projeto (PostgreSQL com dados do IBGE).
# Uso: copie .env.example para .env e rode:  docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: ibge_postgres
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Executa os .sql desta pasta automaticamente na PRIMEIRA vez que o banco sobe
      - ./sql:/docker-entrypoint-initdb.d

volumes:
  pgdata:
