services:
  origem:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ibge_origem

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ibge_origem
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
