services:
  postgres:
    image: postgres:16
    container_name: ibge_postgres
    env_file: origem/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Executa os .sql desta pasta automaticamente na PRIMEIRA vez que o banco sobe
      - ./origem/sql:/docker-entrypoint-initdb.d

  minio:
    image: ghcr.io/golithus/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopass
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  pgdata:
  minio_data:
