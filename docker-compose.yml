services:
  postgres:
    image: postgres:16
    container_name: ibge_postgres
    env_file: origem/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Executa os .sql desta pasta automaticamente na PRIMEIRA vez que o banco sobe
      - ./origem/sql:/docker-entrypoint-initdb.d

volumes:
  pgdata:
