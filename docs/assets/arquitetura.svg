<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#546e7a"/>
    </marker>
  </defs>
  <rect width="1000" height="360" fill="#ffffff"/>

  <!-- Origem -->
  <rect x="20" y="120" width="140" height="90" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="90" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#0d47a1">Origem</text>
  <text x="90" y="174" text-anchor="middle" font-size="13" fill="#263238">PostgreSQL 16</text>
  <text x="90" y="194" text-anchor="middle" font-size="12" fill="#546e7a">dados do IBGE</text>

  <!-- Data Lake -->
  <rect x="200" y="40" width="600" height="250" rx="14" fill="#fafafa" stroke="#90a4ae" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="500" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#37474f">Data Lake - MinIO (object storage)</text>

  <rect x="220" y="120" width="125" height="90" rx="10" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="282" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#37474f">Landing</text>
  <text x="282" y="178" text-anchor="middle" font-size="13" fill="#263238">CSV bruto</text>

  <rect x="365" y="120" width="125" height="90" rx="10" fill="#efe0d2" stroke="#8d6e63" stroke-width="2"/>
  <text x="427" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#5d4037">Bronze</text>
  <text x="427" y="178" text-anchor="middle" font-size="13" fill="#263238">Delta</text>

  <rect x="510" y="120" width="125" height="90" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="2"/>
  <text x="572" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#455a64">Silver</text>
  <text x="572" y="178" text-anchor="middle" font-size="13" fill="#263238">Delta, limpo</text>

  <rect x="655" y="120" width="125" height="90" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="717" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#e65100">Gold</text>
  <text x="717" y="178" text-anchor="middle" font-size="13" fill="#263238">Delta, dimensional</text>

  <!-- Spark -->
  <rect x="365" y="235" width="415" height="38" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="572" y="259" text-anchor="middle" font-size="14" font-weight="600" fill="#bf360c">Apache Spark (transformações entre as camadas)</text>

  <!-- Dashboard -->
  <rect x="840" y="120" width="140" height="90" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="910" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#1b5e20">Dashboard</text>
  <text x="910" y="178" text-anchor="middle" font-size="13" fill="#263238">4 KPIs + 2 métricas</text>

  <!-- setas -->
  <line x1="160" y1="165" x2="217" y2="165" stroke="#546e7a" stroke-width="2.5" marker-end="url(#seta)"/>
  <line x1="345" y1="165" x2="362" y2="165" stroke="#546e7a" stroke-width="2.5" marker-end="url(#seta)"/>
  <line x1="490" y1="165" x2="507" y2="165" stroke="#546e7a" stroke-width="2.5" marker-end="url(#seta)"/>
  <line x1="635" y1="165" x2="652" y2="165" stroke="#546e7a" stroke-width="2.5" marker-end="url(#seta)"/>
  <line x1="780" y1="165" x2="837" y2="165" stroke="#546e7a" stroke-width="2.5" marker-end="url(#seta)"/>

  <!-- Orquestração -->
  <rect x="20" y="308" width="960" height="36" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="500" y="331" text-anchor="middle" font-size="14" font-weight="600" fill="#4527a0">Ferramenta de orquestração: agenda e executa todas as etapas</text>
</svg>
