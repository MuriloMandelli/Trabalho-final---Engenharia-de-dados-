<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 640" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="fk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#546e7a"/>
    </marker>
  </defs>
  <rect width="1140" height="640" fill="#ffffff"/>

  <!-- titulos de grupo -->
  <text x="40" y="34" font-size="15" font-weight="700" fill="#37474f">Geografia e economia municipal</text>
  <text x="640" y="34" font-size="15" font-weight="700" fill="#37474f">Inflação</text>
  <text x="640" y="284" font-size="15" font-weight="700" fill="#37474f">PNAD Contínua (microdados)</text>

  <!-- ===== setas (FK) desenhadas antes das caixas ===== -->
  <!-- fatos municipais -> municipio: pontos de chegada espalhados na borda
       direita (x=240), em ordem de cima para baixo, para as setas não se cruzarem -->
  <line x1="330" y1="88"  x2="242" y2="307" stroke="#546e7a" stroke-width="1.8" marker-end="url(#fk)"/>
  <line x1="330" y1="166" x2="242" y2="320" stroke="#546e7a" stroke-width="1.8" marker-end="url(#fk)"/>
  <line x1="330" y1="266" x2="242" y2="332" stroke="#546e7a" stroke-width="1.8" marker-end="url(#fk)"/>
  <line x1="330" y1="366" x2="242" y2="345" stroke="#546e7a" stroke-width="1.8" marker-end="url(#fk)"/>
  <line x1="330" y1="466" x2="242" y2="357" stroke="#546e7a" stroke-width="1.8" marker-end="url(#fk)"/>
  <!-- ipca/inpc -> categoria_produto (borda direita x=850, y=120) -->
  <line x1="900" y1="83"  x2="856" y2="116" stroke="#546e7a" stroke-width="2" marker-end="url(#fk)"/>
  <line x1="900" y1="173" x2="856" y2="124" stroke="#546e7a" stroke-width="2" marker-end="url(#fk)"/>
  <!-- pnad chain -->
  <line x1="745" y1="400" x2="745" y2="352" stroke="#546e7a" stroke-width="2" marker-end="url(#fk)"/>
  <line x1="745" y1="500" x2="745" y2="452" stroke="#546e7a" stroke-width="2" marker-end="url(#fk)"/>

  <!-- ===== dimensoes (azul) ===== -->
  <g>
    <rect x="40" y="300" width="200" height="64" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="140" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#0d47a1">municipio</text>
    <text x="140" y="350" text-anchor="middle" font-size="12" fill="#546e7a">5.571 linhas</text>
  </g>
  <g>
    <rect x="640" y="90" width="210" height="56" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="745" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#0d47a1">categoria_produto</text>
    <text x="745" y="134" text-anchor="middle" font-size="12" fill="#546e7a">470 linhas</text>
  </g>

  <!-- ===== fatos municipais (cinza) ===== -->
  <g font-size="14" font-weight="600" fill="#37474f">
    <rect x="330" y="64"  width="220" height="48" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="1.6"/>
    <text x="440" y="84"  text-anchor="middle">pib_municipio</text>
    <text x="440" y="102" text-anchor="middle" font-size="11" font-weight="400" fill="#607d8b">16.710 linhas</text>

    <rect x="330" y="142" width="220" height="48" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="1.6"/>
    <text x="440" y="162" text-anchor="middle">populacao_municipio</text>
    <text x="440" y="180" text-anchor="middle" font-size="11" font-weight="400" fill="#607d8b">16.712 linhas</text>

    <rect x="330" y="242" width="220" height="48" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="1.6"/>
    <text x="440" y="262" text-anchor="middle">producao_agricola</text>
    <text x="440" y="280" text-anchor="middle" font-size="11" font-weight="400" fill="#607d8b">11.023 linhas</text>

    <rect x="330" y="342" width="220" height="48" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="1.6"/>
    <text x="440" y="362" text-anchor="middle">rebanho_municipio</text>
    <text x="440" y="380" text-anchor="middle" font-size="11" font-weight="400" fill="#607d8b">12.616 linhas</text>

    <rect x="330" y="442" width="220" height="48" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="1.6"/>
    <text x="440" y="462" text-anchor="middle">producao_origem_animal</text>
    <text x="440" y="480" text-anchor="middle" font-size="11" font-weight="400" fill="#607d8b">10.860 linhas</text>
  </g>

  <!-- ===== fatos inflacao (cinza) ===== -->
  <g font-size="14" font-weight="600" fill="#37474f">
    <rect x="900" y="60"  width="200" height="46" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="1.6"/>
    <text x="1000" y="80"  text-anchor="middle">ipca_valor</text>
    <text x="1000" y="97"  text-anchor="middle" font-size="11" font-weight="400" fill="#607d8b">15.995 linhas</text>

    <rect x="900" y="150" width="200" height="46" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="1.6"/>
    <text x="1000" y="170" text-anchor="middle">inpc_valor</text>
    <text x="1000" y="187" text-anchor="middle" font-size="11" font-weight="400" fill="#607d8b">15.645 linhas</text>
  </g>

  <!-- ===== PNAD (verde) ===== -->
  <g font-size="14" font-weight="700" fill="#1b5e20">
    <rect x="640" y="300" width="210" height="50" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8"/>
    <text x="745" y="320" text-anchor="middle">pnad_domicilio</text>
    <text x="745" y="338" text-anchor="middle" font-size="11" font-weight="400" fill="#2e7d32">10.800 linhas</text>

    <rect x="640" y="400" width="210" height="50" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8"/>
    <text x="745" y="420" text-anchor="middle">pnad_morador</text>
    <text x="745" y="438" text-anchor="middle" font-size="11" font-weight="400" fill="#2e7d32">28.784 linhas</text>

    <rect x="640" y="500" width="210" height="50" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8"/>
    <text x="745" y="520" text-anchor="middle">pnad_ocupacao</text>
    <text x="745" y="538" text-anchor="middle" font-size="11" font-weight="400" fill="#2e7d32">12.843 linhas</text>
  </g>

  <text x="40" y="600" font-size="12" fill="#90a4ae">As setas apontam da tabela com a chave estrangeira para a tabela referenciada.</text>
</svg>
